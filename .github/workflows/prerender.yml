name: Regenerar index.html pre-renderizado

on:
  push:
    branches: [main]
    paths:
      - "index.template.html"
      - "js/**"
      - "scripts/prerender.js"
      - "scripts/build-guias.js"
      - "scripts/build-recetas.js"
      - "scripts/site-layout.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --omit=dev

      - name: Regenerar index.html
        run: npm run prerender

      - name: Publicar cambios generados si los hay
        run: |
          git add index.html sitemap.xml data/search-index.json celiaquia vivir-sin-gluten etiquetado-sin-gluten restaurantes-sin-gluten recetas
          if git diff --cached --quiet; then
            echo "Sin cambios generados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerar index.html, sitemap.xml y páginas de guía/receta [automático]"
          git push
