name: Depurar estructura de una página (uso temporal)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a inspeccionar"
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspeccionar URL
        run: node scripts/debug-fetch.js "${{ inputs.url }}"
