name: Actualizar noticias sobre gluten

on:
  schedule:
    # Cada 6 horas
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --omit=dev

      - name: Descargar noticias
        run: npm run fetch-news

      - name: Regenerar index.html con las noticias nuevas
        run: npm run prerender

      - name: Publicar cambios si algo cambió
        run: |
          git add data/news.json index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en data/news.json, index.html ni sitemap.xml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar noticias sobre gluten [automático]"
          git push
